apiVersion: apps/v1
kind: Deployment
metadata:
  name: personacanvas-backend
  labels:
    app: image-generator
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: image-generator
  template:
    metadata:
      labels:
        app: image-generator
    spec:
      containers:
      - name: generator-core
        image: ai-backend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
